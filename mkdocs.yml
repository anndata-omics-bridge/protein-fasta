site_name: Protein FASTA
site_description: Streaming protein FASTA parsing, interpretation, classification, and validation.
site_url: https://anndata-omics-bridge.github.io/protein-fasta/
repo_url: https://github.com/anndata-omics-bridge/protein-fasta
repo_name: anndata-omics-bridge/protein-fasta
docs_dir: docs
site_dir: public

theme:
  name: material

nav:
  - Home: index.md
  - Workflows: workflows.md
  - Artifacts: artifacts.md
  - API: api.md
  - Rules and detection: configuration.md
  - CLI and walkthrough: cli_walkthrough.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md

plugins:
  - search
  - macros:
      module_name: docs_macros
      on_error_fail: true
      on_undefined: strict

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
