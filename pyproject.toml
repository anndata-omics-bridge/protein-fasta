[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "protein-fasta"
version = "0.2.0"
description = "Streaming protein records and config-driven Polars FASTA frames."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "loguru>=0.7,<1",
    "pydantic>=2.13,<3",
]

[project.scripts]
protein-fasta = "protein_fasta.cli:main"

[project.optional-dependencies]
cli = [
    "cyclopts>=4.20,<5",
    "httpx>=0.28,<1",
    "loguru>=0.7,<1",
    "polars>=1.43.2,<2",
    "xlsxwriter>=3.2,<4",
]
frame = [
    "polars>=1.43.2,<2",
]
uniprot = [
    "httpx>=0.28,<1",
    "polars>=1.43.2,<2",
]
duckdb = [
    "duckdb>=1.4.2,<2",
    "polars>=1.43.2,<2",
    "pyarrow>=22",
]
generation = [
    "fdr_benchmark @ git+https://gitlab.bfabric.org/bioinformatics/fdr_benchmark.git@bbf582e382833cf8bdc439e69edb287842293b02",
]

[project.urls]
Repository = "https://github.com/anndata-omics-bridge/protein-fasta"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "import-linter>=2.9,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]
docs = [
    "pymdown-extensions>=11,<12",
    "zensical==0.0.43",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "benchmarks", "scripts", "docs_macros.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
markers = [
    "generation: requires the private advanced-generation dependency",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["protein_fasta"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["protein_fasta"]
extend_exclude = ["docs_macros\\.py"]
# Polars loads its declared XlsxWriter engine dynamically when `write_excel()` is called, so no
# direct import exists for Deptry to observe.
per_rule_ignores = { DEP002 = ["pyarrow", "xlsxwriter"] }
